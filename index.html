<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Live Search</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  padding:30px;
}

.container{
  max-width:1000px;
  margin:auto;
}

h1{
  font-size:50px;
  margin-bottom:30px;
}

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:30px;
}

input{
  flex:1;
  padding:18px;
  border:none;
  border-radius:12px;
  font-size:18px;
  outline:none;
}

button{
  padding:18px 25px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:#1d4ed8;
}

.loading{
  font-size:20px;
  margin-bottom:20px;
}

.article{
  background:#1a1a1a;
  padding:25px;
  border-radius:16px;
  margin-bottom:25px;
}

.article h2{
  margin-top:0;
  line-height:1.4;
}

.meta{
  opacity:0.7;
  margin-bottom:20px;
}

.description{
  line-height:1.8;
  font-size:17px;
}

.source{
  margin-top:25px;
}

.source a{
  color:#60a5fa;
  text-decoration:none;
}

.source a:hover{
  text-decoration:underline;
}

.no-results{
  background:#1a1a1a;
  padding:25px;
  border-radius:16px;
}

</style>
</head>

<body>

<div class="container">

<h1>AI Live Search</h1>

<div class="search-box">

<input
type="text"
id="query"
placeholder="Search latest topics..."
>

<button onclick="searchNews()">
Search
</button>

</div>

<div id="loading" class="loading"></div>

<div id="results"></div>

</div>

<script>

// ENTER KEY SUPPORT
document
.getElementById("query")
.addEventListener("keypress",function(event){

  if(event.key === "Enter"){
    searchNews();
  }

});

async function searchNews(){

  const query =
    document.getElementById("query").value.trim();

  if(!query){
    alert("Enter search topic");
    return;
  }

  document.getElementById("loading").innerHTML =
    "Fetching latest articles...";

  document.getElementById("results").innerHTML = "";

  try{

    const rssUrl =
      "https://news.google.com/rss/search?q="
      + encodeURIComponent(query);

    const api =
      "https://api.rss2json.com/v1/api.json?rss_url="
      + encodeURIComponent(rssUrl);

    const response = await fetch(api);

    const data = await response.json();

    const items = data.items || [];

    let html = "";

    if(items.length === 0){

      html = `
        <div class="no-results">
          No latest articles found.
        </div>
      `;

    }else{

      items.slice(0,10).forEach(item=>{

        const description =
          item.description || "No description available.";

        html += `

          <div class="article">

            <h2>
              ${item.title}
            </h2>

            <div class="meta">
              Published:
              ${item.pubDate}
            </div>

            <div class="description">
              ${description}
            </div>

            <div class="source">

              <strong>Official Source:</strong>

              <br><br>

              <a
                href="${item.link}"
                target="_blank"
              >
                ${item.link}
              </a>

            </div>

          </div>

        `;

      });

    }

    document.getElementById("results").innerHTML =
      html;

    document.getElementById("loading").innerHTML =
      "";

  }catch(error){

    console.error(error);

    document.getElementById("loading").innerHTML =
      "Failed to fetch latest information.";

  }

}

</script>

</body>
</html>
