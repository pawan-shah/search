<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live News Dashboard</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:30px;
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
}

h1{
  font-size:50px;
  margin-bottom:10px;
}

.subtitle{
  opacity:0.7;
  margin-bottom:30px;
}

.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:30px;
}

button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  background:#1f2937;
  color:white;
  cursor:pointer;
  font-size:15px;
}

button:hover{
  background:#374151;
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px;
}

.card{
  background:#1a1a1a;
  border-radius:16px;
  padding:22px;
  transition:0.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.card h2{
  margin-top:0;
  line-height:1.5;
  font-size:22px;
}

.meta{
  opacity:0.7;
  margin:15px 0;
  font-size:14px;
}

.description{
  line-height:1.7;
  margin-bottom:20px;
}

a{
  color:#60a5fa;
  text-decoration:none;
}

a:hover{
  text-decoration:underline;
}

.loading{
  font-size:20px;
  margin-bottom:20px;
}

.refresh{
  margin-bottom:25px;
  opacity:0.8;
}

.latest-badge{
  display:inline-block;
  background:#dc2626;
  color:white;
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:15px;
}

</style>
</head>

<body>

<div class="container">

<h1>Live News Dashboard</h1>

<div class="subtitle">
Latest articles appear first automatically
</div>

<div class="topbar">

<button onclick="loadNews('technology')">
Technology
</button>

<button onclick="loadNews('artificial intelligence')">
AI
</button>

<button onclick="loadNews('cybersecurity')">
Cybersecurity
</button>

<button onclick="loadNews('stock market')">
Stock Market
</button>

<button onclick="loadNews('bitcoin')">
Crypto
</button>

<button onclick="loadNews('science')">
Science
</button>

<button onclick="loadNews('india')">
India
</button>

</div>

<div class="refresh">
Auto-refresh every 60 seconds
</div>

<div id="loading" class="loading"></div>

<div id="news" class="news-grid"></div>

</div>

<script>

let currentTopic = "technology";

// LOAD DEFAULT
loadNews(currentTopic);

// AUTO REFRESH
setInterval(() => {
  loadNews(currentTopic);
},60000);

async function loadNews(topic){

  currentTopic = topic;

  document.getElementById("loading").innerHTML =
    "Loading latest news...";

  try{

    const rssUrl =
      "https://news.google.com/rss/search?q="
      + encodeURIComponent(topic);

    const api =
      "https://api.rss2json.com/v1/api.json?rss_url="
      + encodeURIComponent(rssUrl);

    const response = await fetch(api);

    const data = await response.json();

    const items = data.items || [];

    // SORT LATEST FIRST
    items.sort((a,b)=>
      new Date(b.pubDate) - new Date(a.pubDate)
    );

    let html = "";

    items.slice(0,20).forEach((item,index)=>{

      const desc =
        item.description || "No description available.";

      html += `

        <div class="card">

          ${
            index < 3
            ? '<div class="latest-badge">LATEST</div>'
            : ''
          }

          <h2>
            ${item.title}
          </h2>

          <div class="meta">

            Published:
            ${new Date(item.pubDate)
              .toLocaleString()}

          </div>

          <div class="description">
            ${desc}
          </div>

          <a
            href="${item.link}"
            target="_blank"
          >
            Official Source
          </a>

        </div>

      `;

    });

    document.getElementById("news").innerHTML =
      html;

    document.getElementById("loading").innerHTML =
      "";

  }catch(error){

    console.error(error);

    document.getElementById("loading").innerHTML =
      "Failed to fetch latest news.";

  }

}

</script>

</body>
</html>
