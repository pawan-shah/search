<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Live News Search</title>

  <style>

    body{
      background:#111;
      color:white;
      font-family:Arial;
      padding:30px;
    }

    input{
      width:70%;
      padding:15px;
      border:none;
      border-radius:10px;
      font-size:18px;
    }

    button{
      padding:15px 20px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
    }

    .card{
      background:#1e1e1e;
      padding:20px;
      border-radius:15px;
      margin-top:20px;
    }

    a{
      color:#60a5fa;
    }

  </style>

</head>

<body>

<h1>Live Search Engine</h1>

<input
  id="query"
  placeholder="Search latest news..."
>

<button onclick="searchNews()">
Search
</button>

<div id="loading"></div>

<div id="results"></div>

<script>

async function searchNews(){

  const query =
    document.getElementById("query").value;

  if(!query) return;

  document.getElementById("loading").innerHTML =
    "Loading latest news...";

  document.getElementById("results").innerHTML = "";

  try{

    // WORKING NEWS SEARCH
    const url =
      "https://hn.algolia.com/api/v1/search?query="
      + encodeURIComponent(query);

    const response = await fetch(url);

    const data = await response.json();

    const hits = data.hits;

    let html = "";

    if(hits.length === 0){

      html = `
        <div class="card">
          No results found.
        </div>
      `;

    }else{

      hits.slice(0,10).forEach(item=>{

        html += `

          <div class="card">

            <h2>
              ${item.title || "No Title"}
            </h2>

            <p>
              Author:
              ${item.author}
            </p>

            <br>

            <a
              href="${item.url}"
              target="_blank"
            >
              Read Article
            </a>

          </div>

        `;

      });

    }

    document.getElementById("results").innerHTML =
      html;

    document.getElementById("loading").innerHTML = "";

  }catch(error){

    console.error(error);

    document.getElementById("loading").innerHTML =
      "Error fetching latest information.";

  }

}

</script>

</body>
</html>
