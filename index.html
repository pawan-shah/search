<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Live News Dashboard</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0b0b0b;
  color:white;
  font-family:Arial,sans-serif;
}

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#111;
  padding:20px;
  border-bottom:1px solid #222;
}

.logo{
  font-size:38px;
  font-weight:bold;
  margin-bottom:20px;
}

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.search-box input{
  flex:1;
  padding:18px;
  border:none;
  border-radius:12px;
  font-size:18px;
  outline:none;
}

.search-box button{
  padding:18px 24px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-size:16px;
}

.search-box button:hover{
  background:#1d4ed8;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:10px;
}

.categories button{
  background:#1f2937;
  border:none;
  color:white;
  padding:12px 18px;
  border-radius:30px;
  cursor:pointer;
  white-space:nowrap;
}

.categories button:hover{
  background:#374151;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.hero{
  background:#121212;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:30px;
  border:1px solid #222;
}

.hero img{
  width:100%;
  height:450px;
  object-fit:cover;
}

.hero-content{
  padding:30px;
}

.hero-title{
  font-size:38px;
  line-height:1.4;
  margin-bottom:20px;
}

.hero-desc{
  line-height:1.9;
  opacity:0.9;
  font-size:18px;
}

.hero-meta{
  margin-top:20px;
  opacity:0.7;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
  gap:25px;
}

.card{
  background:#121212;
  border-radius:20px;
  overflow:hidden;
  border:1px solid #222;
  transition:0.2s;
}

.card:hover{
  transform:translateY(-4px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card-content{
  padding:22px;
}

.card h2{
  font-size:24px;
  line-height:1.5;
  margin-bottom:15px;
}

.card-desc{
  line-height:1.8;
  opacity:0.9;
}

.meta{
  margin-top:20px;
  font-size:14px;
  opacity:0.7;
}

.source-link{
  display:inline-block;
  margin-top:20px;
  color:#60a5fa;
  text-decoration:none;
  word-break:break-word;
}

.source-link:hover{
  text-decoration:underline;
}

.loading{
  font-size:22px;
  margin:30px 0;
}

.badge{
  display:inline-block;
  background:#dc2626;
  color:white;
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
  margin-bottom:15px;
}

.footer{
  padding:40px;
  text-align:center;
  opacity:0.6;
}

@media(max-width:768px){

  .hero-title{
    font-size:28px;
  }

  .hero img{
    height:250px;
  }

}

</style>
</head>

<body>

<div class="header">

<div class="logo">
Global Live News
</div>

<div class="search-box">

<input
type="text"
id="query"
placeholder="Search anything..."
>

<button onclick="loadNews(document.getElementById('query').value)">
Search
</button>

</div>

<div class="categories">

<button onclick="loadNews('world news')">World</button>
<button onclick="loadNews('technology')">Technology</button>
<button onclick="loadNews('artificial intelligence')">AI</button>
<button onclick="loadNews('cybersecurity')">Cybersecurity</button>
<button onclick="loadNews('stock market')">Stock Market</button>
<button onclick="loadNews('bitcoin')">Crypto</button>
<button onclick="loadNews('science')">Science</button>
<button onclick="loadNews('india')">India</button>
<button onclick="loadNews('space')">Space</button>
<button onclick="loadNews('startups')">Startups</button>

</div>

</div>

<div class="container">

<div id="loading" class="loading"></div>

<div id="hero"></div>

<div id="news" class="grid"></div>

</div>

<div class="footer">
Latest news updates automatically every 60 seconds
</div>

<script>

let currentTopic = "world news";

// ENTER KEY SEARCH
document
.getElementById("query")
.addEventListener("keypress",function(event){

  if(event.key === "Enter"){

    loadNews(
      document.getElementById("query").value
    );

  }

});

// INITIAL LOAD
loadNews(currentTopic);

// AUTO REFRESH
setInterval(()=>{

  loadNews(currentTopic);

},60000);

// TIME FORMAT
function formatTime(dateString){

  const now = new Date();

  const date = new Date(dateString);

  const seconds =
    Math.floor((now - date)/1000);

  const minutes =
    Math.floor(seconds/60);

  const hours =
    Math.floor(minutes/60);

  const days =
    Math.floor(hours/24);

  if(minutes < 1){
    return "Just now";
  }

  if(minutes < 60){
    return minutes + " minutes ago";
  }

  if(hours < 24){
    return hours + " hours ago";
  }

  return days + " days ago";

}

// EXTRACT IMAGE FROM DESCRIPTION
function extractImage(html){

  const div =
    document.createElement("div");

  div.innerHTML = html;

  const img =
    div.querySelector("img");

  return img ? img.src : null;

}

// BETTER IMAGE SELECTION
function getBestImage(item){

  const descImage =
    extractImage(item.description);

  if(
    descImage &&
    !descImage.includes("gstatic") &&
    !descImage.includes("google")
  ){
    return descImage;
  }

  if(
    item.thumbnail &&
    !item.thumbnail.includes("gstatic")
  ){
    return item.thumbnail;
  }

  return "https://picsum.photos/600/400";

}

async function loadNews(topic){

  if(!topic) return;

  currentTopic = topic;

  document.getElementById("loading").innerHTML =
    "Loading latest global news...";

  try{

    const rssUrl =
      "https://news.google.com/rss/search?q="
      + encodeURIComponent(topic);

    const api =
      "https://api.rss2json.com/v1/api.json?rss_url="
      + encodeURIComponent(rssUrl);

    const response = await fetch(api);

    const data = await response.json();

    const items = data.items || [];

    // SORT LATEST FIRST
    items.sort((a,b)=>
      new Date(b.pubDate) - new Date(a.pubDate)
    );

    if(items.length === 0){

      document.getElementById("loading").innerHTML =
        "No latest news found.";

      return;

    }

    // HERO ARTICLE
    const hero = items[0];

    const heroHTML = `

      <div class="hero">

        <img
          src="${getBestImage(hero)}"
        >

        <div class="hero-content">

          <div class="badge">
            BREAKING
          </div>

          <div class="hero-title">
            ${hero.title}
          </div>

          <div class="hero-desc">
            ${
              hero.description ||
              "Latest global update."
            }
          </div>

          <div class="hero-meta">

            ${formatTime(hero.pubDate)}

          </div>

          <a
            class="source-link"
            href="${hero.link}"
            target="_blank"
          >
            Official Source
          </a>

        </div>

      </div>

    `;

    document.getElementById("hero").innerHTML =
      heroHTML;

    // REMOVE DUPLICATES
    const seenTitles = new Set();

    let html = "";

    items.slice(1,30).forEach(item=>{

      const cleanTitle =
        item.title
          .toLowerCase()
          .trim();

      // SKIP DUPLICATES
      if(
        seenTitles.has(cleanTitle) ||
        item.link === hero.link
      ){
        return;
      }

      seenTitles.add(cleanTitle);

      html += `

        <div class="card">

          <img
            src="${getBestImage(item)}"
          >

          <div class="card-content">

            <h2>
              ${item.title}
            </h2>

            <div class="card-desc">
              ${
                item.description ||
                "Latest news update."
              }
            </div>

            <div class="meta">

              ${formatTime(item.pubDate)}

            </div>

            <a
              class="source-link"
              href="${item.link}"
              target="_blank"
            >
              Official Source
            </a>

          </div>

        </div>

      `;

    });

    document.getElementById("news").innerHTML =
      html;

    document.getElementById("loading").innerHTML =
      "";

  }catch(error){

    console.error(error);

    document.getElementById("loading").innerHTML =
      "Failed to fetch latest news.";

  }

}

</script>

</body>
</html>
