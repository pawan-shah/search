<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Search Engine</title>

<style>

body{
  background:#0f0f0f;
  color:white;
  font-family:Arial,sans-serif;
  margin:0;
  padding:40px;
}

.container{
  max-width:1000px;
  margin:auto;
}

h1{
  font-size:50px;
  margin-bottom:30px;
}

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:30px;
}

input{
  flex:1;
  padding:18px;
  border:none;
  border-radius:10px;
  font-size:18px;
}

button{
  padding:18px 25px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:#1d4ed8;
}

.loading{
  font-size:20px;
  margin-bottom:20px;
}

.card{
  background:#1a1a1a;
  padding:25px;
  border-radius:15px;
  margin-bottom:20px;
}

.card h2{
  margin-top:0;
}

.card a{
  color:#60a5fa;
  text-decoration:none;
}

.card a:hover{
  text-decoration:underline;
}

.no-results{
  font-size:20px;
  opacity:0.8;
}

</style>
</head>

<body>

<div class="container">

<h1>Live Search Engine</h1>

<div class="search-box">

<input
type="text"
id="query"
placeholder="Search latest topics..."
>

<button onclick="searchNews()">
Search
</button>

</div>

<div id="loading" class="loading"></div>

<div id="results"></div>

</div>

<script>

async function searchNews(){

  const query =
    document.getElementById("query").value.trim();

  if(!query){
    alert("Enter search topic");
    return;
  }

  document.getElementById("loading").innerHTML =
    "Fetching latest news...";

  document.getElementById("results").innerHTML = "";

  try{

    // GOOGLE NEWS RSS
    const rssUrl =
      "https://news.google.com/rss/search?q="
      + encodeURIComponent(query);

    // RSS TO JSON CONVERTER
    const api =
      "https://api.rss2json.com/v1/api.json?rss_url="
      + encodeURIComponent(rssUrl);

    const response = await fetch(api);

    const data = await response.json();

    const items = data.items || [];

    let html = "";

    if(items.length === 0){

      html = `
        <div class="card">
          No latest news found.
        </div>
      `;

    }else{

      items.slice(0,10).forEach(item=>{

        html += `

          <div class="card">

            <h2>${item.title}</h2>

            <p>
              <strong>Published:</strong>
              ${item.pubDate}
            </p>

            <br>

            <a
              href="${item.link}"
              target="_blank"
            >
              Read Full Article
            </a>

          </div>

        `;

      });

    }

    document.getElementById("results").innerHTML =
      html;

    document.getElementById("loading").innerHTML =
      "";

  }catch(error){

    console.error(error);

    document.getElementById("loading").innerHTML =
      "Failed to fetch latest information.";

  }

}

</script>

</body>
</html>
