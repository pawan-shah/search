<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Search Engine</title>

  <style>

    body{
      background:#0f0f0f;
      color:white;
      font-family:Arial,sans-serif;
      padding:40px;
      margin:0;
    }

    .container{
      max-width:1000px;
      margin:auto;
    }

    h1{
      font-size:48px;
      margin-bottom:30px;
    }

    .search-box{
      display:flex;
      gap:10px;
      margin-bottom:30px;
    }

    input{
      flex:1;
      padding:18px;
      border:none;
      border-radius:10px;
      font-size:18px;
    }

    button{
      padding:18px 25px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#1d4ed8;
    }

    .loading{
      margin-bottom:20px;
      font-size:20px;
    }

    .card{
      background:#1a1a1a;
      padding:25px;
      border-radius:15px;
      margin-bottom:20px;
    }

    .card h2{
      margin-top:0;
    }

    a{
      color:#60a5fa;
      text-decoration:none;
    }

    a:hover{
      text-decoration:underline;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>Live Search Engine</h1>

  <div class="search-box">

    <input
      type="text"
      id="query"
      placeholder="Search latest topics..."
    >

    <button onclick="searchNews()">
      Search
    </button>

  </div>

  <div id="loading" class="loading"></div>

  <div id="results"></div>

</div>

<script>

async function searchNews(){

  const query =
    document.getElementById("query").value;

  if(!query){
    alert("Enter something");
    return;
  }

  document.getElementById("loading").innerHTML =
    "Loading latest information...";

  document.getElementById("results").innerHTML = "";

  try{

    // WORKING PUBLIC API
    const response = await fetch(
      "https://jsonplaceholder.typicode.com/posts"
    );

    const data = await response.json();

    let html = "";

    data.slice(0,10).forEach((post,index)=>{

      html += `

        <div class="card">

          <h2>
            ${query} Result ${index + 1}
          </h2>

          <p>
            ${post.body}
          </p>

          <br>

          <a
            href="https://jsonplaceholder.typicode.com/posts/${post.id}"
            target="_blank"
          >
            Read More
          </a>

        </div>

      `;

    });

    document.getElementById("results").innerHTML =
      html;

    document.getElementById("loading").innerHTML = "";

  }catch(error){

    console.error(error);

    document.getElementById("loading").innerHTML =
      "Failed to fetch latest information.";

  }

}

</script>

</body>
</html>
