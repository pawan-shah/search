<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Live News Search</title>

<style>

body{
  background:#0f0f0f;
  color:white;
  font-family:Arial;
  padding:40px;
}

.container{
  max-width:1000px;
  margin:auto;
}

h1{
  font-size:50px;
  margin-bottom:30px;
}

.search{
  display:flex;
  gap:10px;
  margin-bottom:30px;
}

input{
  flex:1;
  padding:18px;
  border:none;
  border-radius:10px;
  font-size:18px;
}

button{
  padding:18px 25px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

.card{
  background:#1a1a1a;
  padding:25px;
  border-radius:15px;
  margin-bottom:20px;
}

.card h2{
  margin-bottom:15px;
}

.article{
  margin-bottom:20px;
  padding-bottom:20px;
  border-bottom:1px solid #333;
}

.article a{
  color:#60a5fa;
  text-decoration:none;
}

.article a:hover{
  text-decoration:underline;
}

.related{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:15px;
}

.related button{
  background:#27272a;
}

.loading{
  font-size:20px;
  margin:20px 0;
}

</style>
</head>

<body>

<div class="container">

<h1>Live Search Engine</h1>

<div class="search">

<input
type="text"
id="query"
placeholder="Search latest topics..."
>

<button onclick="searchNews()">
Search
</button>

</div>

<div id="loading"></div>

<div id="results"></div>

</div>

<script>

async function searchNews(){

  const query =
    document.getElementById("query").value;

  if(!query) return;

  document.getElementById("loading").innerHTML =
    "Fetching latest information...";

  document.getElementById("results").innerHTML = "";

  try{

    // FREE RSS SOURCE
    const rssUrl =
      `https://api.allorigins.win/raw?url=${
        encodeURIComponent(
          `https://news.google.com/rss/search?q=${query}`
        )
      }`;

    const response = await fetch(rssUrl);

    const text = await response.text();

    const parser = new DOMParser();

    const xml =
      parser.parseFromString(text,"text/xml");

    const items =
      xml.querySelectorAll("item");

    let html = "";

    items.forEach((item,index)=>{

      if(index > 9) return;

      const title =
        item.querySelector("title")?.textContent;

      const link =
        item.querySelector("link")?.textContent;

      const pubDate =
        item.querySelector("pubDate")?.textContent;

      const source =
        item.querySelector("source")?.textContent || "Unknown";

      html += `

      <div class="card article">

        <h2>${title}</h2>

        <p>
          <strong>Source:</strong>
          ${source}
        </p>

        <p>
          <strong>Published:</strong>
          ${pubDate}
        </p>

        <br>

        <a href="${link}" target="_blank">
          Read Full Article
        </a>

      </div>

      `;

    });

    // RELATED TOPICS

    const relatedTopics = [
      `${query} latest`,
      `${query} trends`,
      `${query} analysis`,
      `${query} future`,
      `${query} updates`
    ];

    const relatedHTML =
      relatedTopics.map(topic=>`

        <button onclick="searchRelated('${topic}')">
          ${topic}
        </button>

      `).join("");

    html += `

    <div class="card">

      <h2>Related Searches</h2>

      <div class="related">
        ${relatedHTML}
      </div>

    </div>

    `;

    document.getElementById("results").innerHTML =
      html;

    document.getElementById("loading").innerHTML = "";

  }catch(error){

    console.error(error);

    document.getElementById("loading").innerHTML =
      "Failed to fetch latest information.";

  }

}

function searchRelated(topic){

  document.getElementById("query").value = topic;

  searchNews();

}

</script>

</body>
</html>
